# Version catalog is a central place for you to declare and version dependencies
# https://docs.gradle.org/current/userguide/platforms.html#sub:version-catalog
# https://docs.gradle.org/current/userguide/platforms.html#sub::toml-dependencies-format

[versions]
kotlin = "2.4.0"
kotlinxDatetime = "0.8.0"
kotlinxSerializationJSON = "1.11.0"
kotlinxCoroutines = "1.10.2"
clikt = "5.0.1"
javacv = "1.5.14"
polyglot = "25.0.3"

[libraries]
# Kotlin StdLib Extensions (Reflect is JVM-specific, and KGP is Gradle-specific)
kotlinGradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlinReflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlin"}
# KotlinX (Extensions to the StdLib, usually with platform-specific behaviour)
kotlinxDatetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinxDatetime" }
kotlinxSerialization = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerializationJSON" }
kotlinxCoroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinxCoroutinesSwing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "kotlinxCoroutines" }
kotlinxCoroutinesTest = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }

# Clikt CLI parser and Markdown help formatter
clikt = { module = "com.github.ajalt.clikt:clikt", version.ref = "clikt" }
clikt-markdown = { module = "com.github.ajalt.clikt:clikt-markdown", version.ref = "clikt" }

# GraalPy Polyglot for Python Runtime in Python subproject.
polyglot = { module = "org.graalvm.polyglot:polyglot", version.ref = "polyglot" }
polyglot-python = { module = "org.graalvm.polyglot:python", version.ref = "polyglot" }
# ONNXRt for Box Segementation
onnx = { module = "com.microsoft.onnxruntime:onnxruntime", version = "1.22.0" }
# OpenAI library for OCR
openai = { module = "com.openai:openai-java", version = "4.81.0"}
# JavaCV to provide JavaCPP OpenCV + some helpers.
javacv = { module = "org.bytedeco:javacv-platform", version.ref = "javacv" }
# CSV Generation
csv = { module = "com.jsoizo:kotlin-csv", version = "2.0.0" }
# UML Generator, used for docs purposes.
kotlin2plantuml = { module = "io.github.kelvindev15:Kotlin2PlantUML", version = "3.0.16"}

[bundles]
kotlinEcosystem = ["kotlinReflect", "kotlinxDatetime", "kotlinxSerialization", "kotlinxCoroutines", "kotlinxCoroutinesSwing"]
kotlinxEcosystem = ["kotlinxDatetime", "kotlinxSerialization", "kotlinxCoroutines"]
clikt = ["clikt", "clikt-markdown"]
polyglot = ["polyglot", "polyglot-python"]

[plugins]
# Serializaition Codegen Plugin
kotlinPluginSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
# ktfmt Checker Plugin
ktfmtGradlePlugin = { id = "com.ncorti.ktfmt.gradle",  version = "0.26.0" }
# Package Management and Bindgen for GraalPy Polyglot
graalpy = { id = "org.graalvm.python", version.ref = "polyglot" }