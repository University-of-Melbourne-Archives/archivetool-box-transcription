name: Run Tests and Autoformat Compliance Check

on:
  pull-request:
    types:
      - opened
      - synchronize
      - reopened
  workflow-dispatch:


jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout sources
      uses: actions/checkout@v6
    - name: Setup Java
      uses: actions/setup-java@v5
      with:
        distribution: 'graalvm'
        java-version: 21
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
    - name: Run Tests and Format Check with Gradle
      run: ./gradlew check
